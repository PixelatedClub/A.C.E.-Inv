name: Windows release (unverified publisher)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.9.0-cic.32
        required: true
        default: v1.9.0-cic.32
      prerelease:
        description: Mark as a beta/prerelease (does not replace the latest stable download)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, test, and publish A.C.E.
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt -r shared_beta/requirements.txt

      - name: Run automated tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build Team Shapes executable
        shell: pwsh
        run: .\tools\build_windows_release.ps1 -PythonPath python

      - name: Verify Team Shapes metadata and release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "release\A.C.E.exe"
          $info = (Get-Item -LiteralPath $exe).VersionInfo
          $expectedVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($info.CompanyName -ne "Team Shapes") {
              throw "Unexpected CompanyName metadata: $($info.CompanyName)"
          }
          if ($info.ProductVersion -ne $expectedVersion) {
              throw "Executable version $($info.ProductVersion) does not match release tag $env:RELEASE_TAG."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne "NotSigned") {
              throw "Expected an unsigned release, but signature status is $($signature.Status)."
          }
          Write-Host "Company metadata: $($info.CompanyName)"
          Write-Host "Product version: $($info.ProductVersion)"
          Write-Host "Publisher verification: unverified (unsigned)"

      - name: Package release and checksums
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "release"
          $exe = Join-Path $release "A.C.E.exe"
          $zip = Join-Path $release "A.C.E.zip"
          $setup = Join-Path $release "Set Up A.C.E.exe"
          $manifest = Join-Path $release "ace_release.json"
          $settings = Join-Path $release "app_settings.json"
          Compress-Archive -LiteralPath $exe,$setup,$manifest,$settings -DestinationPath $zip -CompressionLevel Optimal -Force
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          @(
              "$zipHash  A.C.E.zip"
              "$exeHash  A.C.E.exe"
              "$setupHash  Set Up A.C.E.exe"
              "$manifestHash  ace_release.json"
          ) | Set-Content -LiteralPath (Join-Path $release "SHA256SUMS.txt") -Encoding ascii
          @"
          A.C.E. is a Team Shapes Windows inventory application. The prepared USB setup installs it on the computer so the USB can be removed. Program updates preserve local inventory and retain one previous program version. This generic release bundle contains no inventory or cadet data; deployment seeds and CIC profiles are supplied separately.

          This release is intentionally unsigned. Windows may display Unknown publisher or a Microsoft Defender SmartScreen warning. Team Shapes appears in the executable's file metadata, but it is not a Windows-verified publisher.

          No Python installation or third-party runtime libraries are required.
          "@ | Set-Content -LiteralPath (Join-Path $release "RELEASE_NOTES.md") -Encoding utf8

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, 'release/A.C.E.zip', 'release/A.C.E.exe', 'release/Set Up A.C.E.exe', 'release/ace_release.json', 'release/SHA256SUMS.txt', 'docs/ACE_Continuity_Guide.pptx', '--target', $env:GITHUB_SHA, '--title', "A.C.E. Inventory $env:RELEASE_TAG", '--notes-file', 'release/RELEASE_NOTES.md')
          if ($env:IS_PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
